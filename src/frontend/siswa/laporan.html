<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>Laporan Jurnal — GeoKBM Live</title>
  <link rel="stylesheet" href="css/siswa.css">
</head>
<body class="report-page">
  <header class="student-hero report-hero">
    <div class="hero-top">
      <div><p class="eyebrow">Laporan jurnal KBM</p><h1 id="reportGreeting">Memuat akun…</h1><p id="reportClass">—</p></div>
      <button class="button button-light button-small" id="logoutButton" type="button">Keluar</button>
    </div>
    <div class="stats-grid report-stats">
      <article class="stat-card"><span>Total entri</span><strong id="totalCount">—</strong></article>
      <article class="stat-card"><span>Guru hadir</span><strong id="reportPresentCount">—</strong></article>
      <article class="stat-card"><span>Tidak hadir</span><strong id="reportAbsentCount">—</strong></article>
      <article class="stat-card"><span>Kehadiran</span><strong id="attendancePercent">—</strong></article>
    </div>
  </header>
  <main class="student-main">
    <div id="reportMessage" class="notice" role="alert" aria-live="polite" hidden></div>
    <section class="panel">
      <p class="eyebrow">Filter periode</p>
      <div class="shortcut-list" aria-label="Pilih periode cepat">
        <button class="shortcut-button" type="button" data-period="today">Hari ini</button>
        <button class="shortcut-button active" type="button" data-period="week">Minggu ini</button>
        <button class="shortcut-button" type="button" data-period="month">Bulan ini</button>
        <button class="shortcut-button" type="button" data-period="last7">7 hari terakhir</button>
      </div>
      <form id="reportFilterForm" class="date-grid">
        <div class="field"><label for="startDate">Dari tanggal</label><input id="startDate" type="date" required></div>
        <div class="field"><label for="endDate">Sampai tanggal</label><input id="endDate" type="date" required></div>
        <button class="button date-submit" type="submit">Tampilkan laporan</button>
      </form>
    </section>
    <section class="panel">
      <div class="panel-heading"><div><p class="eyebrow">Rekap kelas</p><h2>Riwayat jurnal</h2></div></div>
      <div id="reportList" class="record-list" aria-live="polite"><p class="empty-state">Pilih periode untuk melihat laporan.</p></div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="Navigasi siswa">
    <a class="nav-link" href="home.html"><span aria-hidden="true">⌂</span>Beranda</a>
    <a class="nav-link" href="jurnal.html"><span aria-hidden="true">▤</span>Jurnal</a>
    <a class="nav-link active" href="laporan.html" aria-current="page"><span aria-hidden="true">▥</span>Laporan</a>
    <button class="nav-link logout-link" id="logoutNavButton" type="button"><span aria-hidden="true">↪</span>Keluar</button>
  </nav>
  <script src="js/config.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/laporan.js"></script>
</body>
</html>
