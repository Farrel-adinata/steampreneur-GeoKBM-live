<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>Login Siswa — GeoKBM Live</title>
  <link rel="stylesheet" href="css/siswa.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <header class="login-brand">
        <div class="brand-icon" aria-hidden="true">🎓</div>
        <p class="eyebrow">Portal Ketua Kelas</p>
        <h1>GeoKBM Live</h1>
        <p>SMK Negeri 1 Kuwus · NTT</p>
      </header>
      <div id="loginMessage" class="notice" role="alert" aria-live="polite" hidden></div>
      <form id="loginForm" class="form-stack" novalidate>
        <div class="field">
          <label for="identity">NIS, username, atau email</label>
          <input id="identity" name="identity" autocomplete="username" required maxlength="190" placeholder="Masukkan identitas akun">
        </div>
        <div class="field">
          <label for="password">Kata sandi</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button" id="loginButton" type="submit">Masuk ke Jurnal KBM</button>
      </form>
      <p class="login-footnote">Portal jurnal KBM ini khusus untuk ketua kelas.</p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
